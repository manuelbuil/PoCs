apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-passthrough-traefik
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: "rke2-ingress-nginx-migration"
  rules:
  - host: passthrough.test.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: echo-tls-svc
            port:
              number: 443

